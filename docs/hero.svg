<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a3f"/><stop offset=".55" stop-color="#0d1330"/><stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cff"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="720" height="220" rx="18" fill="url(#bg)"/>
  <!-- starfield -->
  <g fill="#8ea2ff">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="150" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60" r="1.4"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="50" r="1.5"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="160" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- rocket -->
  <g transform="translate(96,110)">
    <ellipse cx="0" cy="46" rx="26" ry="7" fill="#38bdf8" opacity=".35">
      <animateTransform attributeName="transform" type="scale" values="1;1.25;1" additive="sum" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0 -44 C14 -24 16 6 10 26 L-10 26 C-16 6 -14 -24 0 -44 Z" fill="url(#acc)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="-8" r="6.5" fill="#070b1a" stroke="#ffd166" stroke-width="2.5"/>
    <path d="M-11 12 L-22 28 L-9 24 Z M11 12 L22 28 L9 24 Z" fill="#7c6cff">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- orbit -->
  <g transform="translate(360,110)">
    <ellipse rx="86" ry="30" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".55" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="7" fill="#ffd166">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 82 -27 A 86 30 0 1 1 -82 27 A 86 30 0 1 1 82 -27"/>
    </circle>
  </g>
  <text x="360" y="98" text-anchor="middle" font-family="Segoe UI,Arial" font-size="52" font-weight="900" fill="url(#acc)" letter-spacing="10">QUIZORA</text>
  <text x="360" y="136" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#93a5c8" letter-spacing="2">Conquer knowledge, one world at a time</text>
  <text x="360" y="176" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#5f6f95">10 worlds · boss battles · power-ups · spaced repetition · offline-first</text>
</svg>
