<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizora — Conquer knowledge, one world at a time</title>
    <meta name="description" content="Quizora: a deep-space adaptive quiz adventure. 250+ questions across 10 worlds, boss battles, power-ups, streaks and achievements — offline-first." />
    <meta name="theme-color" content="#070b1a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="splash">
      <svg class="splash-logo" viewBox="0 0 120 120" aria-label="Quizora logo">
        <defs>
          <linearGradient id="qz-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c6cff"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#qz-g)" stroke-width="4" opacity=".85"/>
        <ellipse cx="60" cy="60" rx="44" ry="16" fill="none" stroke="#8ea2ff" stroke-width="3" transform="rotate(-24 60 60)" opacity=".7"/>
        <path d="M60 22 L74 52 L60 46 L46 52 Z" fill="url(#qz-g)"/>
        <rect x="56.5" y="46" width="7" height="26" rx="3.5" fill="url(#qz-g)"/>
        <circle cx="60" cy="82" r="7" fill="none" stroke="#ffd166" stroke-width="3.5"/>
        <circle cx="60" cy="82" r="2.4" fill="#ffd166"/>
      </svg>
      <h1 class="splash-title">QUIZORA</h1>
      <p class="splash-tag">Conquer knowledge, one world at a time</p>
      <div class="splash-bar"><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
